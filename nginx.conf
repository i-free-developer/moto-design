user deploy;
worker_processes auto;  # 自动设置工作进程数
worker_cpu_affinity auto;  # CPU亲和性优化
worker_rlimit_nofile 100000;  # 增加文件描述符限制

events {
    worker_connections 4000;  # 每个工作进程的最大连接数
    multi_accept on;  # 同时接受多个连接
    use epoll;  # 使用高效的事件模型
}

http {
    # 基础优化
    sendfile on;  # 启用高效文件传输
    tcp_nopush on;  # 优化数据包发送
    tcp_nodelay on;  # 禁用Nagle算法
    keepalive_timeout 65;  # 保持连接超时
    keepalive_requests 10000;  # 单个连接的最大请求数
    reset_timedout_connection on;  # 重置超时连接
    server_tokens off;  # 隐藏Nginx版本信息
    
    # MIME类型设置
    include mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time';
    
    # 日志优化
    # access_log off;  # 生产环境可关闭访问日志
    # 或使用缓冲日志
    access_log /var/log/nginx/access.log main buffer=256k flush=20m gzip=1;
    error_log /var/log/nginx/error.log;
    
    # 连接优化
    client_max_body_size 20M;  # 最大上传文件大小
    client_body_buffer_size 128K;  # 请求体缓冲区大小
    client_header_buffer_size 1k;  # 请求头缓冲区大小
    large_client_header_buffers 4 4k;  # 大型请求头缓冲区
    
    # 超时设置
    client_body_timeout 12;  # 请求体超时
    client_header_timeout 12;  # 请求头超时
    send_timeout 10;  # 响应发送超时
    
    # 压缩配置 (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;  # 为所有代理请求启用压缩
    gzip_comp_level 6;  # 压缩级别 (1-9)
    gzip_min_length 1000;  # 最小压缩文件大小
    gzip_buffers 16 8k;  # 压缩缓冲区
    gzip_http_version 1.1;  # 压缩HTTP版本
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;
    
    # 文件缓存描述符优化
    open_file_cache max=200000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # 静态资源缓存
    map $sent_http_content_type $expires {
        default                    off;
        text/html                 1h;  # HTML缓存1小时
        text/css                  max; # CSS永久缓存 (需配合版本控制)
        application/javascript    max; # JS永久缓存
        application/font-woff     max; # 字体永久缓存
        application/font-woff2    max;
        ~image/                   100h; # 图片永久缓存
    }
    
    # 加载服务器配置
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}